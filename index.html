<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZERA | Mesaj Gönder</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#10131b;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(100%,430px);padding:28px;border:1px solid #303747;border-radius:24px;background:#191f2b;box-shadow:0 18px 60px #0006}
    .tag{color:#9ba9c2;font-size:12px;letter-spacing:.18em}
    h1{margin:8px 0 4px;font-size:38px;letter-spacing:.08em}
    p{color:#aeb9ca;margin:0 0 24px}
    label{display:block;margin:14px 0 8px;font-size:14px;color:#dce3ef}
    textarea{width:100%;min-height:110px;resize:vertical;padding:14px;border-radius:13px;border:1px solid #3b4659;background:#101722;color:white;font:inherit;outline:none}
    textarea:focus{border-color:#7b9cff}
    button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:13px;background:#7898ff;color:#10131b;font-weight:750;font-size:16px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    #status{min-height:24px;margin-top:14px;font-size:14px;color:#c4d0e2}
    .hint{font-size:12px;color:#8996aa;margin-top:16px}
  </style>
</head>
<body>
<main>
  <div class="tag">UZAKTAN MESAJ PANELİ</div>
  <h1>ZERA</h1>
  <p>Robotuna bir mesaj gönder.</p>
  <form id="messageForm">
    <label for="message">Mesajın (en fazla 100 karakter)</label>
    <textarea id="message" maxlength="100" placeholder="Merhaba ZERA!" required></textarea>
    <button id="sendButton" type="submit">ZERA'YA GÖNDER</button>
  </form>
  <div id="status" role="status"></div>
  <div class="hint">Mesaj ZERA'nın ekranında yaklaşık 4 saniye görünür.</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB39DsPyfXE3rq3a4mG43Dh4O081sPCn_I",
    authDomain: "zera-a67ff.firebaseapp.com",
    databaseURL: "https://zera-a67ff-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "zera-a67ff",
    storageBucket: "zera-a67ff.firebasestorage.app",
    messagingSenderId: "467785738312",
    appId: "1:467785738312:web:3689243ba8d7165d83d07d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const form = document.getElementById("messageForm");
  const input = document.getElementById("message");
  const button = document.getElementById("sendButton");
  const status = document.getElementById("status");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    button.disabled = true;
    status.textContent = "Gönderiliyor...";
    try {
      await db.ref("messages/latest").set({
        text: text,
        sentAt: Date.now()
      });
      status.textContent = "Mesaj ZERA'ya gönderildi! 🤖";
      input.value = "";
    } catch (error) {
      status.textContent = "Gönderilemedi: " + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
